<!doctype html>
<meta charset="utf-8">
<title>contact sheet</title>
<style>
  body{margin:0;background:#111;color:#eee;font:12px/1.3 monospace}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}
  figure{margin:0}
  img{width:100%;display:block;background:#000}
  figcaption{padding:1px 3px;color:#9d9}
</style>
<div id="grid"></div>
<script type="module">
const files = await (await fetch('/audit/frames/index.json')).json();
const p = new URLSearchParams(location.search);
const off = +p.get('o') || 0, per = +p.get('n') || 16;
const grid = document.getElementById('grid');
let pending = 0;
for (const f of files.slice(off, off + per)) {
  const fig = document.createElement('figure');
  const img = new Image();
  pending++;
  img.onload = img.onerror = () => { if (--pending === 0) window.__ready = true; };
  img.src = '/audit/frames/' + f;
  const cap = document.createElement('figcaption');
  cap.textContent = f.replace('f-', '').replace('.png', '') + 'ms';
  fig.append(img, cap);
  grid.append(fig);
}
if (!pending) window.__ready = true;
</script>
