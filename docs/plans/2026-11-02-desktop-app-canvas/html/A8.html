<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What happened</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@700&family=Gelasio:wght@400;600&family=Arimo:wght@400;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}
:root{--canvas:#FAF7F2;--surface:#FEFDFB;--doc:#FFFFFF;--sunken:#F5F0E8;--ink:#12243B;--body:#2D3748;--muted:#5B6472;--brand:#1E3A5F;--brand-strong:#182F4D;--brand-soft:#E8EDF4;--accent:#D4A853;--accent-soft:#F5ECD5;--accent-ink:#825E1C;--line:#EBE4D8;--ok:#3A5A4C;--ok-soft:#EEF4F1;--bad:#B91C1C;--bad-soft:#FEF2F2;--s1:0 1px 2px rgb(30 58 95/.06),0 1px 1px -1px rgb(30 58 95/.05);--s2:0 1px 0 rgb(30 58 95/.04),0 10px 24px -12px rgb(30 58 95/.16);--s3:0 1px 0 rgb(30 58 95/.05),0 22px 46px -20px rgb(30 58 95/.22)}
html,body{background:var(--canvas)}
body{width:1280px;min-height:100vh;position:relative;font:400 18px/1.5 Inter,system-ui,sans-serif;color:var(--body);font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.wrap{width:1040px;margin:0 auto}
.top{height:88px;display:flex;align-items:center;gap:56px;width:1040px;margin:0 auto}
.logo{display:flex;align-items:baseline;font:700 23px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em;color:var(--ink)}
.logo svg{height:24px;width:auto;align-self:center;transform:translateY(-1px)}
.logo em{font-style:normal;color:#A37824;margin-left:.22em}
.nav{display:flex;gap:36px;flex:1}
.nav a{font-weight:500;font-size:18px;color:var(--muted);padding:8px 0;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.me{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--brand)}
h1{font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.028em;color:var(--ink);text-wrap:balance}
h2{font-weight:600;font-size:36px;line-height:1.12;letter-spacing:-.022em;color:var(--ink);text-wrap:balance}
h3{font-weight:600;font-size:20px;line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.t{font-weight:600;font-size:20px;line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.m{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 30px;border-radius:999px;font-weight:600;font-size:18px;white-space:nowrap}
.pri{background:var(--brand);color:#fff;box-shadow:var(--s1)}.pri:hover{background:var(--brand-strong)}
.sec{background:var(--sunken);color:var(--ink);height:48px;padding:0 22px;box-shadow:inset 0 0 0 1px var(--line)}.sec:hover{background:var(--line)}
.txt{height:48px;padding:0 6px;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px;text-decoration-thickness:2px}.txt:hover{text-decoration-color:var(--ink)}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap}
.sage{background:var(--ok-soft);color:var(--ok)}.red{background:var(--bad-soft);color:var(--bad)}
.ask{position:absolute;left:120px;bottom:32px;width:1040px;height:68px;display:flex;align-items:center;padding:0 12px 0 28px;background:var(--doc);border-radius:999px;box-shadow:var(--s3),0 0 0 1px var(--line)}
.ask input{flex:1;border:0;background:none;font:400 18px Inter,sans-serif;color:var(--ink);outline:0}.ask input::placeholder{color:var(--muted)}
.send{width:46px;height:46px;border-radius:50%;background:var(--sunken);color:var(--muted);display:grid;place-items:center}
.toast{display:flex;align-items:center;gap:14px;padding:14px 18px 14px 20px;background:var(--ok-soft);border-radius:16px;color:var(--ok);font-weight:500}
.toast .btn{margin-left:auto;height:36px;color:var(--ok);text-decoration-color:currentColor}
.dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.sheet{filter:drop-shadow(0 12px 18px rgb(30 58 95/.14)) drop-shadow(0 1px 1px rgb(30 58 95/.10))}
.pg{position:absolute;inset:0;background:var(--doc);padding:20px 18px;font:400 6.6px/1.42 Arimo,Arial,sans-serif;color:#2D3748;overflow:hidden;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
.fold{position:absolute;right:0;top:0;width:30px;height:30px;background:var(--accent);clip-path:polygon(0 0,0 100%,100% 100%)}
.nm{font:600 14px/1.1 Gelasio,Georgia,serif;color:#12243B}.ti{font:400 7.5px/1.3 Gelasio,Georgia,serif;color:#1E3A5F;margin:2px 0 7px}
.hd{font:600 6.6px Gelasio,Georgia,serif;letter-spacing:.06em;color:#1E3A5F;border-top:.75px solid #12243B;border-bottom:.75px solid #12243B;padding:2px 0;margin:7px 0 4px}
.pg p+p{margin-top:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}html,body{background:var(--surface)}body{width:560px;min-height:0}.dlg{position:relative;padding:44px 40px 36px}.dlg h2{font-size:30px;padding-right:44px}.close{position:absolute;right:22px;top:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.close:hover{background:var(--sunken)}.opts{display:grid;gap:10px;margin-top:26px}.o{height:64px;padding:0 22px;text-align:left;border-radius:8px;background:var(--doc);box-shadow:0 0 0 1px var(--line);font-weight:500;font-size:18px;color:var(--ink)}.o:hover{background:var(--sunken)}</style></head><body><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="d"><button class="close" aria-label="Close" data-doop-on="click" data-doop-action="close-overlay"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><h2 id="d">What happened with Hafenlogistik Nord?</h2><div class="opts"><button class="o" data-doop-on="click" data-doop-action="overlay:x0eanh6i-v" data-doop-transition="dissolve" data-doop-duration="180">They invited me to an interview</button><button class="o" data-doop-on="click" data-doop-action="navigate:4rxX8lfmev" data-doop-transition="dissolve" data-doop-duration="220">They made me an offer</button><button class="o" data-doop-on="click" data-doop-action="navigate:21WuB7t19K" data-doop-transition="dissolve" data-doop-duration="220">They said no</button><button class="o" data-doop-on="click" data-doop-action="close-overlay">I sent a follow-up</button><button class="o" data-doop-on="click" data-doop-action="close-overlay">Nothing yet</button></div></div></body></html>
