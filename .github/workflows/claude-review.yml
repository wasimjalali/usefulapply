name: Claude PR Review

# Plan-agnostic automated PR review (works on both Team and Max).
# Dormant until you opt in:
#   1. Add repo secret  ANTHROPIC_API_KEY   (Settings > Secrets and variables > Actions > Secrets).
#   2. Add repo variable ENABLE_CLAUDE_REVIEW = true   (same screen > Variables tab).
# Until ENABLE_CLAUDE_REVIEW is "true" the job is skipped, so it never fails or bills.
#
# On the Team plan, prefer the managed Code Review service instead
# (claude.ai/admin-settings/claude-code): it runs on subscription credits, needs no API key,
# and posts inline comments with a severity gate. Use this Action for projects on the personal
# Max plan, where the managed service isn't available.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Sonnet is a strong, cheaper default for review. Swap to "--model opus" for deeper passes.
          claude_args: "--model sonnet"
